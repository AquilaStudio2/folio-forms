<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>เลือกหมวดหมู่จัดเก็บเอกสาร</title>
    <style>
      :root {
        color-scheme: light;
        font:
          13px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #172033;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: white;
      }
      [hidden] {
        display: none !important;
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100%;
        overflow: auto;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #94a3b8;
        border-radius: 6px;
        background: white;
        color: #172033;
      }
      h2 {
        margin: 0;
        font-size: 16px;
      }
      p {
        margin: 0;
        overflow-wrap: anywhere;
      }
      label {
        display: grid;
        gap: 4px;
      }
      button,
      select {
        font: inherit;
        box-sizing: border-box;
        min-height: 32px;
        min-width: 0;
        max-width: 100%;
        border: 1px solid #94a3b8;
        border-radius: 4px;
        background: white;
        color: #172033;
        padding: 5px 7px;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid #0f766e;
        outline-offset: 1px;
      }
      button:disabled,
      select:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        margin-top: auto;
      }
    </style>
    <script src="__ONLYOFFICE_PLUGIN_SDK_URL__"></script>
    <script src="./popup.js" defer></script>
  </head>
  <body></body>
</html>
