<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>เลือกชื่อโครงการ PDMS</title>
    <style>
      :root {
        color-scheme: light;
        font:
          13px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #172033;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: white;
      }
      [hidden] {
        display: none !important;
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 5px;
        height: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #94a3b8;
        border-radius: 6px;
        background: white;
        color: #172033;
      }
      p {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .target-title {
        font-weight: 600;
      }
      label {
        display: grid;
        gap: 3px;
      }
      button,
      input {
        font: inherit;
        box-sizing: border-box;
        min-height: 30px;
        border: 1px solid #94a3b8;
        border-radius: 4px;
        background: white;
        color: #172033;
        padding: 5px 7px;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #0f766e;
        outline-offset: 1px;
      }
      button:disabled,
      input:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      #pdms-popup-trigger {
        flex-shrink: 0;
        height: 30px;
        width: 100%;
        font-weight: 600;
        text-align: left;
        border-color: #0f766e;
        background: #f0fdfa;
      }
      #pdms-popup-results {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: grid;
        align-content: start;
        grid-auto-rows: max-content;
        gap: 3px;
      }
      #pdms-popup-results button {
        height: auto;
        line-height: 1.45;
        text-align: left;
        overflow-wrap: anywhere;
        white-space: normal;
      }
      main[data-preview="true"] #pdms-popup-results button:disabled {
        opacity: 1;
        cursor: default;
      }
      [aria-selected="true"] {
        background: #ccfbf1;
        border-color: #0f766e;
      }
    </style>
    <script src="__ONLYOFFICE_PLUGIN_SDK_URL__"></script>
    <script src="./popup.js" defer></script>
  </head>
  <body></body>
</html>
