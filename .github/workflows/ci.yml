name: CI

on:
  push:
    # TODO: drop feature/github-action once the pipeline is verified
    branches: [main, feature/github-action]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: bun run check

      - name: Web tests
        run: bun run --cwd apps/web test

      - name: Server unit tests
        run: bun run --cwd apps/server test:spreadsheet

  build-and-push:
    name: Build and push Docker images
    needs: test
    # TODO: drop feature/github-action once the pipeline is verified
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/main", "refs/heads/feature/github-action"]'), github.ref)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ratanon0191/pdms-folio-server
            dockerfile: apps/server/Dockerfile
          - image: ratanon0191/pdms-folio-web
            dockerfile: apps/web/Dockerfile
            build-args: |
              VITE_API_ORIGIN=${{ vars.VITE_API_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
